<title>Veille politique</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif}
.mc{background:#0a0a0f;color:#e8e8e8;padding:20px;min-height:100vh}
.header{text-align:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #222}
.title{font-size:22px;font-weight:700;color:#fff;letter-spacing:-.5px}
.subtitle{font-size:12px;color:#666;margin-top:4px}
.top-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.metric{background:#12121a;border:1px solid #222;border-radius:10px;padding:14px}
.metric-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.source-list{display:flex;flex-direction:column;gap:4px}
.source-item{font-size:11px;color:#888;display:flex;align-items:center;gap:6px}
.source-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
.rep-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rep-row:last-child{margin-bottom:0}
.rep-name{font-size:12px;font-weight:600;width:110px;flex-shrink:0}
.rep-bar-wrap{flex:1;height:5px;background:#1e1e2a;border-radius:3px}
.rep-bar{height:5px;border-radius:3px}
.rep-count{font-size:11px;color:#555;width:24px;text-align:right;flex-shrink:0}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
.pill{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .2s;opacity:.6}
.pill:hover{opacity:.85;transform:scale(1.05)}
.pill.active{opacity:1;transform:scale(1.08);border-width:2px}
.articles-section{background:#12121a;border:1px solid #222;border-radius:10px;padding:16px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:12px;color:#555;text-transform:uppercase;letter-spacing:.06em}
.article-row{display:flex;align-items:flex-start;gap:10px;padding:10px 8px;border-bottom:1px solid #1a1a24;border-radius:6px;text-decoration:none}
.article-row:hover{background:#16161e}
.article-row:last-child{border-bottom:none}
.theme-stripe{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:40px}
.art-title{font-size:13px;color:#ddd;line-height:1.4;font-weight:500}
.art-resume{font-size:11px;color:#888;margin-top:4px;line-height:1.4}
.art-meta{font-size:11px;margin-top:6px;display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.src-pill{font-size:10px;padding:2px 7px;border-radius:10px;background:#1e1e2a;color:#bbb;font-weight:700}
.date-pill{font-size:10px;padding:2px 7px;border-radius:10px;background:#0a1a2a;color:#38bdf8;font-weight:700}
</style>
</head>
<body>

  <div class="articles-section">

    <div id="art-list"></div>

</div>
<script>
const data = [{"titre":"Présidentielle 2027 : les insoumis et leurs caravanes populaires à la conquête des abstentionnistes","lien":"https://www.lemonde.fr/politique/article/2026/07/26/presidentielle-2027-les-insoumis-et-leurs-caravanes-populaires-a-la-conquete-des-abstentionnistes_6732763_823448.html","source":"Le Monde - Politique","date":"2026-07-26","theme":"LFI","resume":"Durant la période estivale, les activistes du mouvement mélenchoniste parcourent le territoire national en ciblant prioritairement les zones défavorisées. Leur double objectif consiste à mobiliser les citoyens non-inscrits sur les registres électoraux tout en promouvant la campagne du leader du parti auprès des populations précaires.","importance":2},{"titre":"À Villeneuve-Saint-Georges, les méthodes de la police municipale, les plaintes en série et le coup de filet de la police nationale","lien":"https://www.lemonde.fr/societe/article/2026/07/25/a-villeneuve-saint-georges-les-methodes-de-la-police-municipale-les-plaintes-en-serie-et-le-coup-de-filet-de-la-police-nationale_6732382_3224.html","source":"Le Monde - Politique","date":"2026-07-25","theme":"Droite","resume":"Une opération d'envergure de la police nationale a conduit à l'interpellation de neuf agents de la police municipale, dont le directeur Olivier Roussy, ainsi que deux opératrices du centre de supervision urbaine. Ces arrestations font suite à une enquête judiciaire visant sept membres de cette force municipale, missionnée par la maire LR Kristell Niasme pour des interventions plus offensives.","importance":2},{"titre":"Loi d'Urgence agricole dans les Côtes-d'Armor : l'exercice d'équilibriste du député macroniste Éric Bothorel qui a voté contre le texte","lien":"https://www.lemonde.fr/politique/article/2026/07/25/loi-d-urgence-agricole-dans-les-cotes-d-armor-l-exercice-d-equilibriste-du-depute-macroniste-eric-bothorel-qui-a-vote-contre-le-texte_6732172_823448.html","source":"Le Monde - Politique","date":"2026-07-25","theme":"Macron","resume":"L'élu de la majorité présidentielle a choisi de s'opposer au projet gouvernemental concernant le secteur agricole, une position délicate dans un département fortement rural. Cette décision illustre les tensions internes au camp présidentiel sur les questions agricoles.","importance":2},{"titre":"Antisémitisme : la direction de LFI doit prendre ses responsabilités","lien":"https://www.lemonde.fr/idees/article/2026/07/25/antisemitisme-la-direction-de-lfi-doit-prendre-ses-responsabilites_6732134_3232.html","source":"Le Monde - Politique","date":"2026-07-25","theme":"LFI","resume":"Le parti de Jean-Luc Mélenchon est interpellé sur sa gestion des accusations de haine antijuive en son sein. Une mise en cause directe de l'encadrement du mouvement insoumis face aux polémiques récurrentes sur ce sujet sensible.","importance":2},{"titre":"Incendie en Gironde : Sébastien Lecornu annonce l'envoi de 500 militaires supplémentaires et de 1,5 million de masques FFP2","lien":"https://www.lemonde.fr/planete/article/2026/07/25/incendie-en-gironde-sebastien-lecornu-annonce-l-envoi-de-500-militaires-supplementaires-et-de-1-5-million-de-masques-ffp2_6731755_3244.html","source":"Le Monde - Politique","date":"2026-07-25","theme":"Macron","resume":"Le ministre des Armées déploie des moyens humains et matériels importants pour faire face aux feux de forêt dans le département. Cette mobilisation gouvernementale vise à renforcer les dispositifs de lutte contre les flammes et protéger les populations des fumées.","importance":2},{"titre":"DIRECT - Incendies : 55.000 évacuations dans la nuit en Gironde, le trafic ferroviaire interrompu au sud de Bordeaux","lien":"https://www.lesechos.fr/politique-societe/societe/direct-incendies-55000-evacuations-dans-la-nuit-en-gironde-le-trafic-ferroviaire-interrompu-au-sud-de-bordeaux-2244387","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Institutionnel","resume":"Une crise majeure se déroule dans le sud-ouest où plusieurs dizaines de milliers d'habitants de Gironde et des Landes ont dû quitter leurs domiciles durant la nuit. Les services de secours déploient d'importants moyens pour contenir la progression des flammes vers la métropole bordelaise.","importance":3},{"titre":"Incendies : 1.500 militaires et un A400M mobilisés, « la menace reste très sérieuse » en Gironde","lien":"https://www.lesechos.fr/politique-societe/societe/direct-incendies-gironde-var-suivez-les-principales-informations-de-ce-samedi-25-juillet-2244342","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Institutionnel","resume":"Des évacuations massives touchent plusieurs départements du Sud-Ouest face aux feux. L'organisation du Tour de France est modifiée afin de redéployer les effectifs de police et de pompiers vers les zones sinistrées.","importance":3},{"titre":"Après les incendies, se profile la délicate mission de la restauration des forêts","lien":"https://www.lesechos.fr/politique-societe/societe/apres-les-incendies-se-profile-la-delicate-mission-de-la-restauration-des-forets-2244320","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Macron","resume":"Monique Barbut, à la tête du ministère de la Transition écologique, a dévoilé la création d'une structure publico-privée baptisée « France Forêt 2100 ». Cette initiative vise à coordonner les efforts de régénération du patrimoine sylvestre national, durement touché par les feux estivaux.","importance":2},{"titre":"Pollution des feux de forêt : des dégâts importants sur la santé","lien":"https://www.lesechos.fr/politique-societe/societe/pollution-des-feux-de-foret-des-degats-importants-sur-la-sante-2244316","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Institutionnel","resume":"Les incendies qui ravagent la Gironde et d'autres régions dispersent des substances nocives sur plusieurs centaines de kilomètres. Ces émissions toxiques constituent une menace sanitaire majeure pour les habitants exposés.","importance":2},{"titre":"Présidentielle 2027 : Matignon et les banques françaises s'activent pour aider les candidats à financer leur campagne électorale","lien":"https://www.lesechos.fr/elections/presidentielle/presidentielle-2027-matignon-et-les-banques-francaises-sactivent-pour-aider-les-candidats-a-financer-leur-campagne-electorale-2244309","source":"Les Echos - politique & société","date":"2026-07-26","theme":"RN","resume":"Le chef du gouvernement souhaite garantir l'accès au crédit bancaire national pour les prétendants à l'Élysée afin de contrer les influences extérieures. La présidente du Rassemblement national apparaît comme la première bénéficiaire potentielle de ce dispositif.","importance":2},{"titre":"Emmanuel Macron et le romancier Nicolas Mathieu, les faux jumeaux de l'ascenseur social","lien":"https://www.lesechos.fr/politique-societe/emmanuel-macron-president/emmanuel-macron-et-le-romancier-nicolas-mathieu-les-faux-jumeaux-de-lascenseur-social-2244192","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Macron","resume":"Dans le cadre d'une série estivale dressant le portrait de la société française à travers des personnalités culturelles marquantes de la décennie, Les Echos confrontent le discours présidentiel sur la mobilité sociale à la vision littéraire du lauréat du Goncourt 2018. L'œuvre romanesque met en lumière l'écart entre l'ambition politique affichée de vaincre le déterminisme social et la réalité vécue par les Français.","importance":2},{"titre":"Présidentielle 2027 : Gabriel Attal, un « challenger » en campagne tout l'été","lien":"https://www.lesechos.fr/elections/presidentielle/presidentielle-2027-gabriel-attal-un-challenger-en-campagne-tout-lete-2244190","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Macron","resume":"L'ancien Premier ministre se trouve en position de retard face à son rival Édouard Philippe dans les enquêtes d'opinion. Il mise sur une tournée estivale intensive à travers le territoire national pour réduire son handicap et reconquérir l'électorat.","importance":2},{"titre":"DIRECT - Incendies : Macron demande aux Armées « de se mobiliser pour venir en renfort maximal de la sécurité civile »","lien":"https://www.lesechos.fr/politique-societe/societe/direct-incendies-dans-le-sud-de-la-france-suivez-les-principales-informations-de-ce-vendredi-24-juillet-2244126","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Macron","resume":"Face à la propagation des feux dans le Sud-Ouest, le président sollicite le déploiement militaire pour renforcer les dispositifs de lutte contre les flammes. Plusieurs dizaines de milliers d'habitants sont évacués tandis que la coordination européenne est activée pour prévenir une catastrophe majeure dans l'agglomération bordelaise.","importance":3},{"titre":"Natalité : pourquoi la baisse des naissances diffère fortement selon les régions","lien":"https://www.lesechos.fr/politique-societe/societe/natalite-en-france-une-baisse-des-naissances-generalisee-mais-contrastee-selon-les-territoires-2244058","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Institutionnel","resume":"Depuis 2010, l'ensemble du territoire français connaît un déclin démographique lié notamment à la diminution du taux de fécondité. Cette tendance présente toutefois des disparités importantes entre les différentes zones géographiques du pays.","importance":2},{"titre":"Prix de l'essence : le gouvernement à nouveau sous pression","lien":"https://www.lesechos.fr/politique-societe/gouvernement/prix-de-lessence-le-gouvernement-a-nouveau-sous-pression-2244056","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Macron","resume":"Le dispositif d'aide aux gros rouleurs est maintenu deux mois supplémentaires. Les partis de gauche critiquent vivement les profits records du groupe pétrolier français tandis qu'un affrontement majeur sur la fiscalité se profile lors de la rentrée parlementaire.","importance":2},{"titre":"Présidentielle 2027 : François Hollande tisse sa toile","lien":"https://www.lesechos.fr/elections/presidentielle/presidentielle-2027-francois-hollande-tisse-sa-toile-2244034","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Institutionnel","resume":"L'ex-président socialiste multiplie les initiatives en direction d'une possible course à l'Élysée. Il a récemment réuni ses partisans et prévoit la publication d'un ouvrage au début de l'automne pour renforcer son positionnement politique.","importance":2},{"titre":"DIRECT - Incendies en Gironde : près de 20.000 personnes évacuées, les pompiers redoutent une nuit difficile face à « des vents imprévisibles »","lien":"https://www.lesechos.fr/politique-societe/societe/direct-incendies-massifs-dans-le-sud-de-la-france-les-informations-a-suivre-ce-jeudi-23-juillet-2243938","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Institutionnel","resume":"Le secteur de Lège-Cap-Ferret au nord du bassin d'Arcachon fait face à un brasier qui a déjà atteint le cimetière communal et menace directement les zones habitées. Les services de secours anticipent des conditions météorologiques particulièrement défavorables pour les prochaines heures.","importance":3},{"titre":"Imagine-t-on le général de Gaulle faire du gainage ? Tibo InShape, la politique à l'ère des « likes »","lien":"https://www.lesechos.fr/politique-societe/emmanuel-macron-president/imagine-t-on-le-general-de-gaulle-faire-du-gainage-tibo-inshape-la-politique-a-lere-des-likes-2243895","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Macron","resume":"Dans le cadre d'une série estivale sur la société française durant les deux quinquennats d'Emmanuel Macron, cet article explore comment l'essor des influenceurs a incarné un phénomène de narcissisme collectif. Cette transformation culturelle a profondément modifié les stratégies et les codes de la communication politique.","importance":2},{"titre":"Incendie en Gironde : au moins 12.000 personnes évacuées, l'inquiétude monte au Cap-Ferret","lien":"https://www.lesechos.fr/politique-societe/societe/incendie-en-gironde-au-moins-12000-personnes-evacuees-2243833","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Institutionnel","resume":"Un violent incendie a ravagé 2.400 hectares en une journée dans le département, favorisé par des conditions climatiques difficiles. La progression rapide et nocturne du brasier menace directement Lège-Cap-Ferret, contraignant les autorités à organiser l'évacuation massive de plus de douze mille habitants.","importance":3},{"titre":"L'année parlementaire s'achève sur des débats plus tendus que jamais","lien":"https://www.lesechos.fr/politique-societe/politique/lannee-parlementaire-sacheve-sur-des-debats-plus-tendus-que-jamais-2243806","source":"Les Echos - politique & société","date":"2026-07-26","theme":"Institutionnel","resume":"La session extraordinaire du Palais Bourbon a pris fin mercredi, clôturant une période marquée par de vives tensions entre les groupes parlementaires. Le climat politique se crispe alors que la prochaine échéance présidentielle se rapproche.","importance":2},{"titre":"« Une vision de droite d'être la France et de gauche d'être français » : Emmanuel Macron, dix ans de commémorations sous le signe du « en même temps »","lien":"https://www.lefigaro.fr/politique/une-vision-de-droite-d-etre-la-france-et-de-gauche-d-etre-francais-emmanuel-macron-dix-ans-de-commemorations-sous-le-signe-du-en-meme-temps-20260726","source":"Le Figaro - Politique","date":"2026-07-26","theme":"Macron","resume":"Cinquième volet d'une série sur les rituels du pouvoir macronien, cet article analyse la stratégie mémorielle du président à travers ses choix de panthéonisations et cérémonies officielles. La dernière entrée au Panthéon de Marc Bloch et son épouse en juin illustre comment le chef de l'État utilise ces événements pour délivrer des messages politiques, mêlant histoire nationale et positionnement contre ses adversaires.","importance":2},{"titre":"Élection présidentielle de 2027 : Bruno Le Maire prône de « changer de système » et pas seulement le « réformer »","lien":"https://www.lefigaro.fr/politique/election-presidentielle-de-2027-bruno-le-maire-prone-de-changer-de-systeme-et-pas-seulement-le-reformer-20260725","source":"Le Figaro - Politique","date":"2026-07-25","theme":"Macron","resume":"Deux ans après avoir quitté ses fonctions ministérielles, l'ancien locataire de Bercy esquisse dans La Tribune dimanche un projet politique axé sur la rupture et la construction d'un nouveau modèle. Il constate que la France traverse une crise de régime larvée et n'exclut pas de se présenter à l'élection présidentielle.","importance":2}];
const couleurs = {"LFI":{"hex":"#e53e3e"},"RN":{"hex":"#1a3a6e"},"Macron":{"hex":"#1D9E75"},"Droite":{"hex":"#BA7517"},"Institutionnel":{"hex":"#888780"}};
const couleursTexte = {"RN":"#4a7ac8"};

function render(filter) {
  const filtered = filter === 'all' ? data : data.filter(a => (a.theme || 'Institutionnel') === filter);
  document.getElementById('art-count').textContent = filtered.length + ' résultats';
  document.getElementById('art-list').innerHTML = filtered.map(a => {
    const c = couleurs[a.theme] || { hex: '#888780' };
    const textColor = couleursTexte[a.theme] || c.hex;
    return `<a class="article-row" href="${a.lien}" target="_blank">
      <div class="theme-stripe" style="background:${c.hex}"></div>
      <div style="flex:1;min-width:0">
        <div class="art-title">${a.titre}</div>
        ${a.resume ? `<div class="art-resume">${a.resume}</div>` : ''}
        <div class="art-meta">
          <span class="src-pill">${a.source || ''}</span>
          <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${c.hex}22;color:${textColor};border:1px solid ${c.hex}44;font-weight:700">${a.theme}</span>
          ${a.date ? `<span class="date-pill">${a.date}</span>` : ''}
        </div>
      </div>
    </a>`;
  }).join('');
}

document.getElementById('pills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  const color = pill.dataset.color;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.remove('active');
    const c = p.dataset.color;
    p.style.borderColor = c === '#fff' ? '#ffffff44' : c + '44';
    p.style.background = c === '#fff' ? '#ffffff11' : c + '11';
    p.style.opacity = '.6';
  });
  pill.classList.add('active');
  pill.style.borderColor = color;
  pill.style.background = color === '#fff' ? '#ffffff22' : color + '22';
  pill.style.opacity = '1';
  render(pill.dataset.f);
});

const firstPill = document.querySelector('.pill');
if (firstPill) {
  firstPill.classList.add('active');
  firstPill.style.borderColor = firstPill.dataset.color;
  firstPill.style.background = firstPill.dataset.color + '22';
  firstPill.style.opacity = '1';
  render(firstPill.dataset.f);
}
</script>
</body>
</html>
