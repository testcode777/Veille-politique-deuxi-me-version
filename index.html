-se-met-au-service-de-la-lutte-contre-les-megafeux-2245247","source":"Les Echos - politique & société","date":"2026-07-31","theme":"Institutionnel","resume":"Face à la multiplication des incendies, les investissements se réorientent vers des technologies de prévention et de détection avancées. Un marché mondial émerge autour de ces solutions, enjeu aussi de souveraineté technologique.","importance":2},{"titre":"Avec les incendies, « il pleuvait des cendres » : à Saint-Jean-d'Illac, aux portes de Bordeaux, une semaine en enfer","lien":"https://www.lesechos.fr/pme-regions/nouvelle-aquitaine/avec-les-incendies-il-pleuvait-des-cendres-a-saint-jean-dillac-aux-portes-de-bordeaux-une-semaine-en-enfer-2245188","source":"Les Echos - politique & société","date":"2026-07-31","theme":"Institutionnel","resume":"La petite commune d'Île-de-France a vécu une semaine critique d'évacuation massive avec plus de 200 pompiers mobilisés. Les habitants commencent à regagner leurs domiciles après les incendies.","importance":2},{"titre":"Direct - Incendies : deux points toujours « actifs » en Gironde, la presqu'île du Cap Ferret « reste inaccessible »","lien":"https://www.lesechos.fr/politique-societe/societe/direct-incendies-fontainebleau-gironde-var-turquie-le-point-sur-la-situation-en-france-et-en-europe-ce-jeudi-30-juillet-2245092","source":"Les Echos - politique & société","date":"2026-07-31","theme":"Institutionnel","resume":"Une amélioration météorologique permet à 144 000 personnes de rentrer chez elles en Gironde. Cependant, le Cap Ferret reste isolé en raison d'un foyer actif persistant près du Claouey.","importance":3},{"titre":"Allumer des feux contre les incendies : l'étonnante stratégie des pompiers face aux brasiers","lien":"https://www.lesechos.fr/politique-societe/societe/allumer-des-feux-contre-les-incendies-letonnante-strategie-des-pompiers-face-aux-brasiers-2245065","source":"Les Echos - politique & société","date":"2026-07-31","theme":"Institutionnel","resume":"Les ser e-changement-climatique-peut-effacer-une-grande-partie-de-la-croissance-economique-2244926","source":"Les Echos - politique & société","date":"2026-07-31","theme":"Institutionnel","resume":"Dans un contexte de quatrième vague de chaleur en France et en Europe, un jeune économiste primé alerte sur les risques du réchauffement climatique pour les performances économiques nationales.","importance":2},{"titre":"DIRECT - Incendies : reprise de feu dans la forêt de Fontainebleau et dans le Var","lien":"https://www.lesechos.fr/politique-societe/societe/direct-incendies-gironde-var-espagne-le-point-sur-la-situation-en-france-et-en-europe-ce-mercredi-29-juillet-2244870","source":"Les Echos - politique & société","date":"2026-07-31","theme":"Institutionnel","resume":"La situation reste critique avec 65 départements en alerte orange et 42 000 hectares brûlés en Gironde. De nouvelles reprises de feu compliquent les opérations de lutte aux quatre coins du territoire.","importance":3},{"titre":"Incendies : au-delà des critiques et des polémiques, les vrais chiffres des moyens déployés par l'État","lien":"https://www.lesechos.fr/economie-france/budget-fiscalite/incendies-au-dela-des-critiques-et-des-polemiques-les-vrais-chiffres-des-moyens-deployes-par-letat-2244849","source":"Les Echos - politique & société","date":"2026-07-31","theme":"Institutionnel","resume":"L'État a doublé les crédits alloués à la Sécurité civile en dix ans et triplé les investissements dans le matériel lourd. Cependant, ces moyens accrus demeurent insuffisants face à la crise actuelle.","importance":2},{"titre":"[Roman de l'été] Si Marine Le Pen était élue présidente de la République","lien":"https://www.valeursactuelles.com/clubvaleurs/politique/roman-de-lete-si-marine-le-pen-etait-elue-presidente-de-la-republique","source":"Valeurs Actuelles - Politique","date":"2026-07-30","theme":"RN","resume":"Uchronie : après une campagne présidentielle marquée par des ralliements de figures politiques de droite, Marine Le Pen remporte l'élection présidentielle et doit affronter les défis du pouvoir.","importance":1},{"titre":"Présidentielle 2027 : le milliardaire Mathieu Pigasse invité à l'université d'été de La France insoumise","lien":"https://www.valeursactuelles.com/politique/presidentielle-2027-le-milliardaire-mathieu-pigasse-invite-a-luniversite-dete-de-la-france-insoumise","source":"Valeurs Actuelles - Politique","date":"2026-07-30","theme":"LFI","resume":"Un homme d'affaires milliardaire est invité aux universités d'été de La France insoumise en août prochain pour débattre avec Manuel Bompard. Cette présence crée une tension avec la doctrine anti-capitaliste du mouvement.","importance":1}];

    const textColor = couleursTexte[a.theme] || c.hex;
    return `<a class="article-row" href="${a.lien}" target="_blank">
      <div class="theme-stripe" style="background:${c.hex}"></div>
      <div style="flex:1;min-width:0">
        <div class="art-title">${a.titre}</div>
        ${a.resume ? `<div class="art-resume">${a.resume}</div>` : ''}
        <div class="art-meta">
          <span class="src-pill">${a.source || ''}</span>
          <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${c.hex}22;color:${textColor};border:1px solid ${c.hex}44;font-weight:700">${a.theme}</span>
          ${a.date ? `<span class="date-pill">${a.date}</span>` : ''}
        </div>
      </div>
    </a>`;
  }).join('');
}

document.getElementById('pills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  const color = pill.dataset.color;
  document.querySelectorAll('.pill').forEach(p => {
    p.classList.remove('active');
    const c = p.dataset.color;
    p.style.borderColor = c === '#fff' ? '#ffffff44' : c + '44';
    p.style.background = c === '#fff' ? '#ffffff11' : c + '11';
    p.style.opacity = '.6';
  });
  pill.classList.add('active');
  pill.style.borderColor = color;
  pill.style.background = color === '#fff' ? '#ffffff22' : color + '22';
  pill.style.opacity = '1';
  render(pill.dataset.f);
});

const firstPill = document.querySelector('.pill');
if (firstPill) {
  firstPill.classList.add('active');
  firstPill.style.borderColor = firstPill.dataset.color;
  firstPill.style.background = firstPill.dataset.color + '22';
  firstPill.style.opacity = '1';
  render(firstPill.dataset.f);
}
</script>
</body>
</html>
